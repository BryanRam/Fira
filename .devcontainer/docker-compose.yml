name: fira-devcontainer

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/Fira:cached
      # node_modules live in named volumes: much faster than a Windows/WSL
      # bind mount, and keeps Linux-only binaries out of the host checkout.
      - api-node-modules:/workspaces/Fira/api/node_modules
      - web-node-modules:/workspaces/Fira/web/node_modules
      - claude-config:/home/node/.claude
      - command-history:/commandhistory
    # Optional: values from the repo-root .env (e.g. real LDAP settings).
    # Anything under `environment` below takes precedence.
    env_file:
      - path: ../.env
        required: false
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fira-dev-password
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/fira-dev-password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  api-node-modules:
  web-node-modules:
  claude-config:
  command-history:
  neo4j-data:
